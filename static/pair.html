<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS — Pair Device</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#07090f; --card:rgba(255,255,255,0.04); --border:rgba(255,255,255,0.08);
      --accent:#6366f1; --adim:rgba(99,102,241,0.15); --text:#dde3ed; --muted:#5e6a7e; }
    html,body{height:100%;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      display:flex;align-items:center;justify-content:center}
    .card{width:360px;padding:40px 34px;background:var(--card);border:1px solid var(--border);
      border-radius:22px;text-align:center}
    .logo{font-size:22px;font-weight:700;letter-spacing:8px;margin-bottom:4px}
    .logo em{color:var(--accent);font-style:normal}
    .sub{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:24px}
    img.qr{width:260px;height:260px;border-radius:16px;background:#fff;padding:12px;display:block;margin:0 auto 18px}
    .how{font-size:11.5px;color:var(--muted);line-height:1.7;text-align:left;
      background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
    .how b{color:var(--text)}
    .err{margin-top:14px;font-size:12px;color:#f87171}
    a.back{display:inline-block;margin-top:18px;color:var(--accent);font-size:12px;text-decoration:none;letter-spacing:1px}
  </style>
</head>
<body>
<div class="card">
  <div class="logo"><em>J</em>ARVIS</div>
  <div class="sub">Pair your phone</div>
  <div id="content"><p style="font-size:13px;color:var(--muted)">Generating QR…</p></div>
  <div class="err" id="err"></div>
  <a class="back" href="/">← Back to dashboard</a>
</div>
<script>
(async()=>{
 try{
  const tok=sessionStorage.getItem('jarvis_token');
  if(!tok){location.replace('/login');return;}
  const r=await fetch('/pair',{headers:{'Authorization':'Bearer '+tok}});
  if(r.status===401){location.replace('/login');return;}
  const d=await r.json();
  document.getElementById('content').innerHTML=
   `<img class="qr" src="data:image/png;base64,${d.qr_png_base64}">
    <div class="how">
     <b>Android:</b> Camera app → point at code → tap the link that slides up.<br><br>
     <b>iPhone:</b> Camera app → point at code → tap the Safari banner.<br><br>
     Both open this dashboard already signed in — same network required (phone & computer on the same Wi-Fi).
    </div>`;
 }catch(e){document.getElementById('err').textContent='Failed: '+e;}
})();
</script>
</body>
</html>
