<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS — Knowledge Core</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #07090f;
    --surface: rgba(255,255,255,0.04);
    --border:  rgba(255,255,255,0.07);
    --accent:  #6366f1;
    --adim:    rgba(99,102,241,0.14);
    --text:    #dde3ed;
    --muted:   #5e6a7e;
    --green:   #22c55e;
    --gdim:    rgba(34,197,94,0.14);
    --amber:   #ffb300;
  }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    flex-shrink: 0; display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    background: rgba(7,9,15,0.95);
  }
  .logo { font-size: 15px; font-weight: 700; letter-spacing: 6px; }
  .logo em { color: var(--accent); font-style: normal; }
  .pill {
    display: flex; align-items: center; gap: 6px; padding: 4px 11px;
    border-radius: 99px; background: var(--surface); border: 1px solid var(--border);
    font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); transition: all 0.3s;
  }
  .pill.on { background: var(--gdim); border-color: rgba(34,197,94,0.3); color: var(--green); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
  .pill.on .dot { background: var(--green); animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .spacer { flex: 1; }
  #stats { font-size: 10px; font-family: monospace; color: var(--muted); padding: 4px 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }

  /* ── LAYOUT ── */
  #body { flex: 1; display: flex; min-height: 0; }
  main#feedcol { flex: 1.2; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); }
  #feedwrap { flex: 1; overflow-y: auto; padding: 14px 16px 8px; }
  #feedwrap::-webkit-scrollbar { width: 3px; }
  #feedwrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── GRAPH PANE ── */
  aside#graphcol { width: 44%; min-width: 340px; display: flex; flex-direction: column; background: var(--bg); }
  .pane-lbl { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); padding: 8px 12px 4px; }
  #graphwrap { flex: 1; position: relative; cursor: grab; min-height: 0; }
  #graphwrap.dragging { cursor: grabbing; }
  canvas { width: 100%; height: 100%; display: block; }
  #tooltip { position: absolute; pointer-events: none; background: #10131cee; border: 1px solid var(--accent);
    padding: 7px 10px; border-radius: 8px; font-size: 12px; max-width: 260px; display: none;
    line-height: 1.45; box-shadow: 0 4px 18px rgba(0,0,0,.5); z-index: 5; }
  #factsbar { flex-shrink: 0; max-height: 130px; overflow-y: auto; border-top: 1px solid var(--border); padding: 8px 12px; font-size: 11.5px; color: var(--muted); }
  #factsbar::-webkit-scrollbar { width: 3px; }
  .factcard { border-left: 2px solid var(--accent); background: var(--adim); padding: 4px 8px; margin: 3px 0; border-radius: 0 8px 8px 0; color: var(--text); }
  .factcard sup { color: #f87171; font-size: 9px; }

  /* ── MESSAGES ── */
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; animation: pop 0.18s ease; margin-bottom: 10px; white-space: pre-wrap; }
  @keyframes pop { from { opacity:0; transform:translateY(4px); } }
  .msg-j   { align-self:flex-start; background:var(--adim);   border:1px solid rgba(99,102,241,0.18); border-bottom-left-radius:4px; }
  .msg-u   { align-self:flex-end;   background:var(--surface); border:1px solid var(--border);        border-bottom-right-radius:4px; }
  .msg-sys { align-self:center; font-size:11px; color:var(--muted); padding:2px 0; background:transparent; border:none; letter-spacing:0.3px; }
  .lbl { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; margin-bottom:4px; }
  .msg-j .lbl { color:var(--accent); }
  .msg-u .lbl { color:var(--muted); text-align:right; }
  #feedwrap { display: flex; flex-direction: column; gap: 10px; }
  .typing { display:inline-flex; gap:4px; padding:2px 0; }
  .typing i { width:6px; height:6px; border-radius:50%; background:var(--accent); animation:tblink 1.2s infinite; }
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes tblink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

  /* ── FOOTER ── */
  footer { flex-shrink:0; padding:10px 14px; border-top:1px solid var(--border); background:rgba(7,9,15,0.95); display:flex; gap:8px; align-items:center; }
  #inp { flex:1; padding:11px 14px; background:var(--surface); border:1.5px solid var(--border); border-radius:12px; color:var(--text); font-size:14px; outline:none; transition:border-color 0.15s; }
  #inp:focus { border-color: var(--accent); }
  #inp::placeholder { color: var(--muted); }
  .btn { padding:11px 15px; border:none; border-radius:12px; font-size:11px; font-weight:700; letter-spacing:1.5px; cursor:pointer; transition:opacity 0.15s,transform 0.1s; }
  .btn:active { transform: scale(0.96); }
  .btn:hover  { opacity: 0.82; }
  .btn-send { background: var(--accent); color: #fff; }
  .hint { font-size: 10px; color: var(--muted); padding: 0 16px 6px; }
  .hint b { color: var(--accent); }

  /* ── TOAST ── */
  #toast {
    position:fixed; top:66px; left:50%; transform:translateX(-50%) translateY(-8px);
    background:rgba(34,197,94,0.16); border:1px solid rgba(34,197,94,0.4);
    color:var(--green); font-size:12px; font-weight:700; letter-spacing:1px;
    padding:7px 18px; border-radius:99px;
    opacity:0; transition:opacity 0.22s,transform 0.22s;
    pointer-events:none; white-space:nowrap;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div id="toast"></div>
  <header>
    <div class="logo"><em>J</em>ARVIS</div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="spacer"></div>
    <div id="stats">…</div>
  </header>
  <div id="body">
    <main id="feedcol">
      <div id="feedwrap"><div id="feed" style="display:flex;flex-direction:column;gap:10px;"></div></div>
      <div class="hint">Chat & ingest · prefix <b>remember:</b> to store a fact only</div>
      <footer>
        <input id="inp" placeholder="Send a command to JARVIS…" autocomplete="off">
        <button class="btn btn-send" onclick="send()">SEND</button>
      </footer>
    </main>
    <aside id="graphcol">
      <div class="pane-lbl">Temporal knowledge graph</div>
      <div id="graphwrap"><canvas id="cv"></canvas><div id="tooltip"></div></div>
      <div id="factsbar">Graph memory facts used in the last answer appear here.</div>
    </aside>
  </div>
<script>
const API="";
const feed=document.getElementById('feed');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');
 setTimeout(()=>el.classList.remove('show'),2200);}
function setPill(on,txt){document.getElementById('pill').classList.toggle('on',on);
 document.getElementById('st').textContent=txt;}
// ---------- graph physics ----------
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const wrap=document.getElementById('graphwrap'),tip=document.getElementById('tooltip');
let nodes=[],links=[],N={},pan={x:0,y:0},drag=null,mouse={x:-9999,y:-9999};
function resize(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio;}
addEventListener('resize',resize);resize();
wrap.addEventListener('mousedown',e=>{drag={x:e.clientX-pan.x,y:e.clientY-pan.y};wrap.classList.add('dragging')});
addEventListener('mouseup',()=>{drag=null;wrap.classList.remove('dragging')});
addEventListener('mousemove',e=>{
 const r=cv.getBoundingClientRect();
 mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;
 if(drag){pan.x=e.clientX-drag.x;pan.y=e.clientY-drag.y;}
});
async function loadStats(){try{
 const [s,g]=await Promise.all([fetch(API+'/stats').then(r=>r.json()),fetch(API+'/graph?limit=200').then(r=>r.json())]);
 document.getElementById('stats').textContent=`E:${s.Entity||0} R:${s.RELATES_TO||0} EP:${s.Episodic||0}`;
 const old=N;
 nodes=g.nodes.map(n=>({...n,x:(Math.random()-.5)*400,y:(Math.random()-.5)*400,vx:0,vy:0}));
 nodes.forEach(n=>{if(old[n.id]){n.x=old[n.id].x;n.y=old[n.id].y;}N[n.id]=n;});
 links=g.edges.filter(e=>N[e.source]&&N[e.target]);
 setPill(true,'Graph online');
}catch(e){setPill(false,'Offline');}}
function tick(){
 for(const n of nodes){ n.vx*=.85;n.vy*=.85;
  n.x+=n.vx+((Math.random()-.5)*.1);n.y+=n.vy+((Math.random()-.5)*.1); }
 for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
  const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1;
  if(d<160){const f=(160-d)/d*.02;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;} }
 for(const l of links){const a=N[l.source],b=N[l.target];
  let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-140)/d*.005;
  a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;}
 for(const n of nodes){n.vx-=n.x*.0004;n.vy-=n.y*.0004;}
}
function draw(){
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 ctx.clearRect(0,0,cv.width,cv.height);
 const w=cv.clientWidth,h=cv.clientHeight,k=.55+Math.min(w,h)/2200;
 ctx.save();ctx.translate(w/2+pan.x,h/2+pan.y);ctx.scale(k,k);
 ctx.strokeStyle='rgba(99,102,241,.12)';
 for(let r=90;r<Math.max(w,h)*1.5;r+=110){ctx.beginPath();ctx.arc(-pan.x,-pan.y,r,0,7);ctx.stroke();}
 let hovered=null;
 const mx=(mouse.x-w/2-pan.x)/k,my=(mouse.y-h/2-pan.y)/k;
 for(const l of links){const a=N[l.source],b=N[l.target];
  ctx.strokeStyle='rgba(99,102,241,.35)';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  const dx=b.x-a.x,dy=b.y-a.y,len2=dx*dx+dy*dy||1;
  const t=Math.max(0,Math.min(1,((mx-a.x)*dx+(my-a.y)*dy)/len2));
  if(Math.hypot(mx-(a.x+t*dx),my-(a.y+t*dy))<8)hovered={label:l.label};
 }
 for(const n of nodes){
  const over=Math.hypot(mx-n.x,my-n.y)<12;
  if(over)hovered={node:n};
  ctx.fillStyle=over?'#818cf8':'#6366f1';ctx.shadowColor='#6366f1';ctx.shadowBlur=over?16:8;
  ctx.beginPath();ctx.arc(n.x,n.y,over?6:4,0,7);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle=over?'#c7d2fe':'#dde3ed';ctx.font=(over?'bold ':'')+'10px -apple-system,sans-serif';
  ctx.fillText(n.name.slice(0,20),n.x+7,n.y-5);}
 ctx.restore();
 if(hovered&&hovered.label!==undefined||hovered&&hovered.node){
  tip.style.display='block';tip.style.left=(mouse.x+14)+'px';tip.style.top=(mouse.y+10)+'px';
  tip.innerHTML=hovered.node
    ?`<b style="color:#818cf8">${esc(hovered.node.name)}</b><br>entity`
    :`<b style="color:#818cf8">${esc(hovered.label)}</b>`;
 }else tip.style.display='none';
 requestAnimationFrame(()=>{tick();draw();});
}
loadStats().then(draw);
setInterval(loadStats,8000);
// ---------- chat ----------
function add(cls,text,tag){const d=document.createElement('div');d.className='msg '+cls;
 d.innerHTML=(tag?`<div class="lbl">${tag}</div>`:'')+esc(text||'');
 feed.appendChild(d);feed.parentElement.scrollTop=1e9;return d;}
add('sys','— knowledge core synchronised —');
add('j','Good to have you back, sir.','jarvis');
function showFacts(facts){
 document.getElementById('factsbar').innerHTML=facts.length
  ? facts.map(f=>`<div class="factcard">${esc(f.fact)}${f.invalid_at?' <sup>SUPERSEDED</sup>':''}</div>`).join('')
  : '(no relevant memories yet)';
}
async function send(){
 const inp=document.getElementById('in'),v=inp.value.trim();if(!v)return;
 inp.value='';
 add('u',v,'you');
 const remember=v.toLowerCase().startsWith('remember:');
 try{
  if(remember){
   const r=await fetch(API+'/ingest',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:v.slice(9),source:'manual'})}).then(r=>r.json());
   if(r.ok){add('j',r.facts_added.map(f=>'• '+f.fact).join('\n')||'(no new facts)','committed to memory');
    add('sys','— ingested —');loadStats();}
   else add('j','Ingest failed: '+(r.detail||'?'),'error');
  }else{
   const d=add('j','','jarvis');
   d.innerHTML='<div class="lbl">JARVIS</div><span class="typing"><i></i><i></i><i></i></span>';
   let buf='';
   const res=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message:v})});
   const reader=res.body.getReader(),dec=new TextDecoder();
   while(true){const {done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});d.innerHTML='<div class="lbl">JARVIS</div>'+esc(buf);
    feed.parentElement.scrollTop=1e9;}
   showFacts(await fetch(API+'/search',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({query:v,num_results:6})}).then(r=>r.json()).then(r=>r.results));
   fetch(API+'/ingest',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:`User said: ${v}`,source:'chat'})}).then(()=>loadStats());
  }
 }catch(e){add('j','Core offline: '+e,'error');}
}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
